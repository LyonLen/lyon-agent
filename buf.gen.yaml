# Local plugins only — remote plugins resolve buf.build on every run and
# the network becomes a build dependency (lesson from the reference repo).
# Versions are locked in step with go.mod: protoc-gen-go v1.36.12
# (google.golang.org/protobuf v1.36.12), protoc-gen-connect-go v1.21.0
# (connectrpc.com/connect v1.21.0). Regenerate with:
#   PATH="$(go env GOPATH)/bin:$PATH" buf lint && buf generate
# Go (gen/go) and TS (web/src/gen) products are both committed — a change
# that lands only one side leaves the other side uncompilable.
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  # TS side (Phase 3): ONE plugin, not the v1 pair — protoc-gen-es v2
  # emits messages AND service descriptors in the same *_pb.ts, which
  # @connectrpc/connect v2's createClient consumes directly
  # (protoc-gen-connect-es stopped at 1.7.0: it is v1-runtime-only).
  # Generator and @bufbuild/protobuf runtime are pinned to the exact same
  # version in web/package.json (2.16.0), connect runtime 2.2.0 alongside.
  - local: ["node", "web/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es"]
    out: web/src/gen
    opt: target=ts
