syntax = "proto3";

package lyon.v1;

option go_package = "lyon-agent/gen/go/lyon/v1;lyonv1";

// ApprovalService — lyond wires tools.ApproveFunc to this service
// (path-aware by default, strict under -approve; cmd/lyond/main.go): the
// approvee parks until Decide or the run context dies (deny, matching TUI).
// The same stream carries plan-mode interceptions (mode_block below) —
// one card pipeline for every human gate.
service ApprovalService {
  rpc WatchPending(WatchPendingRequest) returns (stream WatchPendingResponse);
  rpc Decide(DecideRequest) returns (DecideResponse);
}

// WatchPendingResponse is one pending approval (draft name ApprovalRequest;
// renamed for lint STANDARD's RPC_RESPONSE_STANDARD_NAME — the message is
// the streamed response, not a request).
// Stream semantics: the server first sends the current set, then updates.
// tool_name == "" is a resolve — drop the card keyed by
// (session_id, exec_id): it was decided, interrupted, or reaped. Live
// arrivals always carry tool_name and input_json.
message WatchPendingResponse {
  string session_id = 1;
  int64 exec_id = 2;
  string tool_name = 3;
  string input_json = 4;
  int64 requested_at_ms = 5;
  // mode_block: a plan-mode interception, not a NeedsApproval ask — the
  // client renders the chooser (vouch file / switch mode / deny) and
  // answers with Decide.action instead of approve/remember.
  bool mode_block = 6;
  // reason: why the gate parked this call — the human-readable rule label
  // (e.g. "工作区外绝对路径"). Empty when the gate carried no hit info
  // (strict -approve) or for mode_block cards.
  string reason = 7;
  // matched: the exact fragment of the input the rule matched — the client
  // highlights it inside input_json so the human sees WHAT triggered the
  // ask, not just that one happened.
  string matched = 8;
}
message WatchPendingRequest {}

// ModeAction is the chooser's answer on a mode_block pending. Old clients
// that only speak approve/remember map approve → MODE_DEFAULT (let the
// call run, leave plan) and deny → MODE_ACTION_DENY; unspecified fails
// closed to deny.
enum ModeAction {
  MODE_ACTION_UNSPECIFIED = 0;
  MODE_ACTION_DENY = 1;
  MODE_ACTION_ALLOW_PATH = 2;   // session vouch for this file (write/edit path)
  MODE_ACTION_MODE_DEFAULT = 3; // SetMode(default) — approvals resume as wired
  MODE_ACTION_MODE_BYPASS = 4;  // SetMode(bypass) — approvals auto-pass too
}

message DecideRequest {
  string session_id = 1;
  int64 exec_id = 2;
  bool approve = 3;
  bool remember = 4;   // grant persists for this seat in $LYON_HOME/approvals.json
  ModeAction action = 5; // mode_block pendings: authoritative (see enum note)
}
// DecideResponse (draft name ApprovalDecision).
message DecideResponse {
  string session_id = 1;
  int64 exec_id = 2;
  bool approve = 3;
}
