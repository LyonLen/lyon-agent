syntax = "proto3";

package lyon.v1;

option go_package = "lyon-agent/gen/go/lyon/v1;lyonv1";

// FileService: workspace file access for the web panel. Every path is
// workspace-relative and passed through the same containment as the agent's
// read_file (confine(), pkg/tools/files.go:49) — absolute paths, "..", and
// symlink escapes are rejected fail-closed.
//
// Read RPCs serve the preview. Write RPCs (v2) are user-initiated panel
// operations, not agent tool calls: they never enter the agent approval
// gate (no ExecEvent exists for them) — destructive intent is confirmed by
// the client before the call (portal precedent), and the server still
// fail-closes on containment, existing-target conflicts, and size caps.
service FileService {
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  rpc ReadTextFile(ReadTextFileRequest) returns (ReadTextFileResponse);
  rpc ReadBinaryFile(ReadBinaryFileRequest) returns (ReadBinaryFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
  rpc Rename(RenameRequest) returns (RenameResponse);
  rpc Move(MoveRequest) returns (MoveResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  // TODO(v2): stream download for large files.
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_DIR = 1;
  FILE_KIND_TEXT = 2;    // utf-8 text
  FILE_KIND_CODE = 3;    // code/config — rendered <pre> client-side
  FILE_KIND_MARKDOWN = 4;
  FILE_KIND_IMAGE = 5;   // png/jpg/jpeg/gif/webp
  FILE_KIND_PDF = 6;
  FILE_KIND_OTHER = 7;   // unsupported for preview; download only
}

message DirEntry {
  string name = 1;
  bool is_dir = 2;
  int64 size_bytes = 3;
  int64 mtime_unix_ms = 4;
  FileKind kind = 5;     // extension-allowlist detection server-side (mirror of DocPreview.pickRenderer)
}

message ListDirectoryRequest {
  string path = 1;       // workspace-relative; "" = workspace root
}
message ListDirectoryResponse {
  string path = 1;
  repeated DirEntry entries = 2;
  bool truncated = 3;    // entry-count cap hit
}

message ReadTextFileRequest {
  string path = 1;
  int32 offset_lines = 2;  // 1-based; 0 = from start (same semantics as tools.ReadFile)
  int32 limit_lines = 3;   // 0 = no limit
}
message ReadTextFileResponse {
  string path = 1;
  string content = 2;
  bool truncated = 3;      // hit the 512KB preview cap
  int32 total_lines = 4;
  int64 size_bytes = 5;    // full file size, even when truncated
  FileKind kind = 6;
}

message ReadBinaryFileRequest {
  string path = 1;
}
message ReadBinaryFileResponse {
  string path = 1;
  string content_type = 2;  // image/png, application/pdf, ...
  bytes data = 3;           // capped; truncated=true when the cap trimmed it
  bool truncated = 4;
  int64 size_bytes = 5;     // full file size
}

// --- write ops (v2, user-initiated) -------------------------------------

message WriteFileRequest {
  string path = 1;
  string content = 2;      // full replacement, utf-8 ("" creates an empty file)
  bool create_only = 3;    // new-file op: AlreadyExists when the path is taken
}
message WriteFileResponse {
  int64 size_bytes = 1;
}

message MkdirRequest {
  string path = 1;
  bool create_parents = 2; // mkdir -p; otherwise the parent must exist
}
message MkdirResponse {}

// Rename keeps the file inside its directory: new_name is a single path
// segment (no separators) — use Move to change directories.
message RenameRequest {
  string path = 1;
  string new_name = 2;
}
message RenameResponse {}

// Move relocates path into to_dir (also workspace-confined); name is kept.
message MoveRequest {
  string path = 1;
  string to_dir = 2;
}
message MoveResponse {}

// Delete removes a file, or a directory only when recursive=true (empty
// dirs go through with recursive=false — rm -r semantics).
message DeleteRequest {
  string path = 1;
  bool recursive = 2;
}
message DeleteResponse {}

message UploadFileRequest {
  string path = 1;
  bytes data = 2;          // capped server-side at the binary preview cap
  bool overwrite = 3;      // default fail-closes on an existing target
}
message UploadFileResponse {
  int64 size_bytes = 1;
}
