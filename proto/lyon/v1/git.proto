syntax = "proto3";

package lyon.v1;

option go_package = "lyon-agent/gen/go/lyon/v1;lyonv1";

// GitService: the files panel's source-control view — the VS Code
// source-control sidebar in miniature (changes list, commit box, sync,
// outgoing commit graph). Every command runs as `git -C <workspace> …`
// with a fixed argv; the RPCs accept no remote or flag arguments (Diff's
// path is a workspace-relative file name that rides one argv slot after
// `--`, never a flag), so the panel can only ever act on the workspace
// repository itself. Commit stages everything (`git add -A`,
// gitignore-respected) — the panel commits the working tree, it is not a
// staging-area editor.
service GitService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Log(LogRequest) returns (LogResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Sync(SyncRequest) returns (SyncResponse);
  rpc Diff(DiffRequest) returns (DiffResponse);
}

message StatusRequest {}

// One working-tree entry from `git status --porcelain=v1`.
message GitChange {
  string path = 1;  // repo-root-relative, "/"-separated as git prints it
  string xy = 2;    // raw porcelain XY (e.g. "M ", " M", "??", "R ")
  bool staged = 3;  // X half is not blank/'?' — it enters the next commit
  string kind = 4;  // modified | added | deleted | renamed | untracked | conflicted
}

message StatusResponse {
  bool is_repo = 1;   // false → the panel hides the whole view
  string branch = 2;  // current branch, or "HEAD (no branch)" when detached
  string upstream = 3; // e.g. "origin/main"; empty = no upstream set
  int32 ahead = 4;    // commits local has over upstream
  int32 behind = 5;   // commits upstream has over local
  repeated GitChange changes = 6;
}

message LogRequest {
  int32 limit = 1; // 0 → server default (30), capped at 100
}

// One commit of the graph section. `refs` carries git's decoration
// ("HEAD -> main", "origin/main", "tag: v1") — the badge row.
message GitCommit {
  string sha = 1;    // full sha; the panel shortens for display
  string subject = 2;
  string author = 3;
  int64 at_unix = 4;
  repeated string refs = 5;
  bool outgoing = 6; // not yet in upstream (false when no upstream)
}

message LogResponse {
  repeated GitCommit commits = 1;
}

message CommitRequest {
  string message = 1;
}

message CommitResponse {
  string sha = 1;     // short sha of the new commit
  string summary = 2; // "<branch> <sha> <subject>" as git printed it
}

message SyncRequest {}

message SyncResponse {
  string output = 1; // combined pull --rebase + push output
}

// Diff: one path's unified diff against HEAD — staged and unstaged
// changes together (无论是否已 add: both halves show). This powers the
// 产出文件 card's 变更模式 (#42); the web routes ONLY that card's change
// rows here, plain preview never calls it. Untracked files have no HEAD
// entry (git prints nothing) — the card sends those to the plain preview.
message DiffRequest {
  string path = 1; // workspace-relative, "/"-separated (as git prints it)
}

message DiffResponse {
  bool is_repo = 1; // false → not a repository (empty diff)
  string diff = 2;  // unified diff text; "" = no text change vs HEAD
}
