syntax = "proto3";

package lyon.v1;

option go_package = "lyon-agent/gen/go/lyon/v1;lyonv1";

import "google/protobuf/timestamp.proto";
import "lyon/v1/event.proto";

// SessionService: lifecycle + prompt injection + event streaming.
// Response wrappers (rather than returning the Session data type directly)
// keep lint STANDARD's RPC_RESPONSE_STANDARD_NAME /
// RPC_REQUEST_RESPONSE_UNIQUE rules clean and leave room to grow each RPC's
// response without touching shared messages.
service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);

  // SubmitPrompt runs one prompt now (maps to Session.Submit). Busy session
  // -> codes.FailedPrecondition (client should fall back to EnqueuePrompt).
  rpc SubmitPrompt(SubmitPromptRequest) returns (SubmitPromptResponse);

  // EnqueuePrompt parks a prompt into the session inbox (#2; maps to
  // Session.Enqueue). Idle session -> codes.FailedPrecondition
  // ("not busy; use SubmitPrompt").
  rpc EnqueuePrompt(EnqueuePromptRequest) returns (EnqueuePromptResponse);

  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc SetMode(SetModeRequest) returns (SetModeResponse);

  // WatchEvents is the server-streaming event feed: replay from the hub
  // ring then go live. Multiple concurrent watchers per session are fine.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);

  // GetHistory is the unary twin of WatchEvents(from_seq=-1): the whole
  // replayable history as one content-length batch (seq-ascending).
  // Web transcripts render from this — streaming responses over the dev
  // proxy can stall before their first byte, and a stalled stream must
  // cost live deltas only, never the initial render. The client anchors
  // its WatchEvents at last_seq so the tail starts exactly where the
  // batch ended; last_seq 0 (empty history) means "replay with -1".
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);

  // RestoreSession re-opens a saved snapshot (a path exactly as
  // DashboardService.ListSnapshots returned it) as a live session: the
  // stored history is synthesized into the hub ring, so an ordinary
  // WatchEvents(from_seq=-1) replays it and the conversation continues
  // like any other session. Paths outside $LYON_HOME/sessions fail with
  // codes.InvalidArgument before any disk touch; missing or empty
  // snapshots fail with codes.NotFound.
  rpc RestoreSession(RestoreSessionRequest) returns (RestoreSessionResponse);

  // Undo stack (TUI /rollback parity). Every prompt captures a checkpoint
  // before running (pkg/agent/rollback.go); RollbackSession discards the
  // history back to that point AND re-synthesizes the session's event ring
  // (WatchEvents replays return the post-rollback transcript; reconnect
  // with from_seq=-1 after a rollback).
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  rpc RollbackSession(RollbackSessionRequest) returns (RollbackSessionResponse);
  // SaveCheckpoint pins an explicit undo point (TUI /rollback save parity):
  // label the checkpoint before a risky stretch of work, then roll back to
  // it later. Fails codes.FailedPrecondition on an empty history.
  rpc SaveCheckpoint(SaveCheckpointRequest) returns (SaveCheckpointResponse);
}

// Checkpoint is one undo point: a prompt boundary or a pre-compaction
// capture (kind distinguishes them).
message Checkpoint {
  int32 id = 1;         // opaque handle for RollbackRequest.id
  string kind = 2;      // "prompt" | "compact"
  string label = 3;     // prompt excerpt / "before compact (N msgs)"
  int32 messages = 4;   // history length at capture
  google.protobuf.Timestamp at = 5;
}
message ListCheckpointsRequest { string session_id = 1; }
message ListCheckpointsResponse { repeated Checkpoint checkpoints = 1; }
message RollbackSessionRequest {
  string session_id = 1;
  int32 id = 2;         // from ListCheckpoints; 0 = the newest checkpoint
}
message RollbackSessionResponse { Checkpoint checkpoint = 1; }
message SaveCheckpointRequest {
  string session_id = 1;
  string label = 2; // empty = server default ("manual checkpoint (N msgs)")
}
message SaveCheckpointResponse { Checkpoint checkpoint = 1; }

message Session {
  string id = 1;
  string workspace = 2;                     // engine cfg.Workspace
  string model = 3;
  string title = 4;                         // Session.Title(); may be empty early
  string mode = 5;                          // "default" | "plan" | "bypass" (pkg/agent/mode.go)
  bool busy = 6;                            // needs new Session.Busy() accessor (gap)
  int32 queue_len = 7;                      // parked prompts; needs new accessor (gap)
  int32 turns = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp last_active = 10;
  // Model context window (pkg/models knowledge base, engine
  // cfg.ContextWindow fallback) — the denominator of the web ctx gauge,
  // mirroring cmd/lyon/usage.go windowFor so both surfaces read alike.
  int64 context_window = 11;
}

message CreateSessionRequest {
  string model = 1;   // "" = engine default
  string mode = 2;    // "" = default
}
message CreateSessionResponse { Session session = 1; }
message ListSessionsRequest {}              // live sessions in the store
message ListSessionsResponse { repeated Session sessions = 1; }
message GetSessionRequest { string session_id = 1; }
message GetSessionResponse { Session session = 1; }
message DeleteSessionRequest { string session_id = 1; }
message DeleteSessionResponse {}

message SubmitPromptRequest {
  string session_id = 1;
  string prompt = 2;
  string model = 3;   // per-prompt override, "" = session default
}
message SubmitPromptResponse { bool started = 1; }

message EnqueuePromptRequest {
  string session_id = 1;
  string prompt = 2;
}
message EnqueuePromptResponse { int32 queue_len = 1; }

message InterruptRequest { string session_id = 1; }
message InterruptResponse { bool interrupted = 1; }

message GetStatsRequest { string session_id = 1; }
message TurnStat {
  int32 turn = 1;
  string stop_reason = 2;
  Usage usage = 3;
  int64 duration_ms = 4;
  google.protobuf.Timestamp at = 5;
}
message GetStatsResponse { repeated TurnStat turns = 1; }

message SetModeRequest {
  string session_id = 1;
  string mode = 2;    // "default" | "plan" | "bypass"
}
message SetModeResponse { string mode = 1; }

// One streamed chunk wraps one hub event (SessionEvent stays a pure data
// type so other surfaces — e.g. run dumps — can share its shape).
message WatchEventsResponse { SessionEvent event = 1; }

message WatchEventsRequest {
  string session_id = 1;
  // 0 = live only; -1 = replay everything still in the ring, then live;
  // n > 0 = replay ring entries with seq > n, then live. If the ring no
  // longer holds n+1 the server fails with codes.FailedPrecondition and the
  // client should re-anchor (snapshot list / run dump) and retry with -1.
  int64 from_seq = 2;
}

message GetHistoryRequest { string session_id = 1; }
message GetHistoryResponse {
  repeated SessionEvent events = 1;  // seq-ascending; [] = nothing to replay
  int64 last_seq = 2;                // last event's seq (0 = empty) — open WatchEvents from here
}

message RestoreSessionRequest {
  // Absolute snapshot path exactly as ListSnapshots reported it — must
  // land inside $LYON_HOME/sessions (the server re-validates the
  // containment before reading).
  string path = 1;
}
message RestoreSessionResponse {
  Session session = 1;
  int32 restored_messages = 2;  // history length synthesized into the ring
}
