syntax = "proto3";

package lyon.v1;

option go_package = "lyon-agent/gen/go/lyon/v1;lyonv1";

// SkillService: the read side of the skills feature — the panel's
// installed list (personal + commons + workspace .lyon/skills), and the
// SKILL.md viewer behind a click-to-expand row. Skill HITS do NOT ride
// this service: they are synthesized into the event stream as
// skill_used (hub.go, files_changed precedent), so the transcript card
// and the panel's 本会话命中 section read the same source of truth.
service SkillService {
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse);
}

message Skill {
  string name = 1;
  string description = 2;
  string path = 3;    // absolute path of the SKILL.md file
  string source = 4;  // personal | commons | workspace
}

message ListSkillsRequest {}

message ListSkillsResponse {
  repeated Skill skills = 1; // name-ascending, deduped by name (first root wins)
}

message GetSkillRequest {
  string name = 1; // lookup within the scanned roots (used when path is empty)
  string path = 2; // direct SKILL.md path — fail-closed: must sit under a skills root
}
message GetSkillResponse {
  string name = 1;
  string description = 2;
  string path = 3;
  string content = 4; // the SKILL.md text, clipped at the content cap
  bool truncated = 5;
}
